<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background atmospheric glow matching the webpage ambiance -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#081319" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06090E" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#010508" stop-opacity="1" />
    </radialGradient>

    <!-- Subtle central Nordic cyan ambient aura behind the V -->
    <radialGradient id="center-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4B7784" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#2B4C60" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#081319" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#010508" stop-opacity="0" />
    </radialGradient>

    <!-- Official Left Pillar Gradients -->
    <linearGradient id="v-titanium-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#DBECFE" />
      <stop offset="70%" stop-color="#A3BDCC" />
      <stop offset="100%" stop-color="#40626B" />
    </linearGradient>

    <linearGradient id="v-bevel-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#6B8C9D" stop-opacity="0.25" />
    </linearGradient>

    <!-- Official Right Pillar Gradients -->
    <linearGradient id="v-titanium-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#BAD1E3" />
      <stop offset="70%" stop-color="#7892A9" />
      <stop offset="100%" stop-color="#2B4C60" />
    </linearGradient>

    <linearGradient id="v-bevel-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25333D" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.85" />
    </linearGradient>

    <!-- Official Horizon Crossbar Gradients -->
    <linearGradient id="v-crossbar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081319" stop-opacity="0" />
      <stop offset="20%" stop-color="#71716F" stop-opacity="0.6" />
      <stop offset="42%" stop-color="#A3BDCC" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="58%" stop-color="#A3BDCC" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#71716F" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#081319" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="v-crossbar-bloom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25333D" stop-opacity="0" />
      <stop offset="30%" stop-color="#4B7784" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#DBECFE" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#4B7784" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#25333D" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="v-crossbar-subtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25333D" stop-opacity="0" />
      <stop offset="50%" stop-color="#BAD1E3" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#25333D" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="v-diamond-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#DBECFE" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2B4C60" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base (Obsidian Noir) -->
  <rect width="1024" height="1024" fill="#010508" />
  <rect width="1024" height="1024" fill="url(#bg-grad)" />

  <!-- Ambient light aura in center behind V -->
  <circle cx="512" cy="512" r="440" fill="url(#center-aura)" />

  <!-- 
    The 'V' Symbol is centered at (x=70, y=75).
    Scale factor: 3.5 (gives 728px width, 420px height; fits safely inside 900px avatar circle)
  -->
  <g transform="translate(512, 512) scale(3.5) translate(-70, -75)">
    <!-- Left Monolithic Pillar -->
    <path
      d="M10 15L62 135H77L35 15H10Z"
      fill="url(#v-titanium-left)"
    />
    <path
      d="M10 15L62 135H66L14 15H10Z"
      fill="url(#v-bevel-left)"
    />

    <!-- Right Monolithic Pillar -->
    <path
      d="M130 15L78 135H63L105 15H130Z"
      fill="url(#v-titanium-right)"
    />
    <path
      d="M126 15L74 135H78L130 15H126Z"
      fill="url(#v-bevel-right)"
    />

    <!-- Apex Locking Vertex (Bottom Anchor Wedge) -->
    <polygon
      points="70,118 78,135 62,135"
      fill="#FFFFFF"
    />

    <!-- Precision Horizon Crossbar Blades (Static Brand Identity, No Animation Streaks) -->
    <g>
      <!-- Soft bloom on blade -->
      <ellipse
        cx="70"
        cy="67"
        rx="85"
        ry="3"
        fill="url(#v-crossbar-bloom)"
      />

      <!-- Primary Tapered Titanium Crossbar Blade -->
      <path
        d="M -15 67 L -10 65.5 H 150 L 155 67 L 150 68.5 H -10 Z"
        fill="url(#v-crossbar-grad)"
      />

      <!-- Secondary Parallel Hairline Accent Rail Beneath Beam -->
      <path
        d="M 20 71.5 H 120"
        stroke="url(#v-crossbar-subtle)"
        stroke-width="1.2"
        stroke-linecap="round"
      />

      <!-- Outboard Horizon Floating Accent Notches -->
      <line x1="-34" y1="67" x2="-22" y2="67" stroke="#71716F" stroke-width="1.2" stroke-linecap="round" />
      <line x1="162" y1="67" x2="174" y2="67" stroke="#71716F" stroke-width="1.2" stroke-linecap="round" />

      <!-- Central Precision Diamond Reticle & Subtle Native Glow -->
      <circle cx="70" cy="67" r="8" fill="url(#v-diamond-glow)" />
      <polygon
        points="70,62.5 74.5,67 70,71.5 65.5,67"
        fill="#FFFFFF"
      />
    </g>
  </g>
</svg>
